eight": 0.044}, {"src": 549, "tgt": 499, "weight": 0.034}, {"src": 275, "tgt": 550, "weight": 0.528}, {"src": 550, "tgt": 269, "weight": 0.48}, {"src": 550, "tgt": 270, "weight": 0.508}, {"src": 275, "tgt": 551, "weight": 0.582}, {"src": 551, "tgt": 269, "weight": 0.554}, {"src": 551, "tgt": 270, "weight": 0.514}, {"src": 275, "tgt": 552, "weight": 0.499}, {"src": 552, "tgt": 269, "weight": 0.431}, {"src": 552, "tgt": 270, "weight": 0.424}, {"src": 275, "tgt": 553, "weight": 0.49}, {"src": 553, "tgt": 269, "weight": 0.504}, {"src": 553, "tgt": 270, "weight": 0.469}, {"src": 275, "tgt": 554, "weight": 0.346}, {"src": 554, "tgt": 269, "weight": 0.353}, {"src": 554, "tgt": 270, "weight": 0.3}, {"src": 275, "tgt": 555, "weight": 0.368}, {"src": 555, "tgt": 269, "weight": 0.405}, {"src": 555, "tgt": 270, "weight": 0.389}, {"src": 286, "tgt": 556, "weight": 0.104}, {"src": 556, "tgt": 379, "weight": 0.117}, {"src": 556, "tgt": 386, "weight": 0.061}];

// ── scene ─────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x0a0a0a);
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.01, 1000);
camera.position.set(0, 0, 40);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(5,10,10); scene.add(dl);

// ── positions & velocities ────────────────────────────────
const pos = {}, vel = {}, anc = {};
NODES.forEach(n => {
  pos[n.id] = {x:n.x, y:n.y, z:n.z};
  vel[n.id] = {x:0,   y:0,   z:0  };
  anc[n.id] = n.anchored;
});

// ── meshes ────────────────────────────────────────────────
const nodeMap = {}, nodeMesh = [];
NODES.forEach(n => {
  const geo = new THREE.SphereGeometry(n.size, 12, 12);
  const mat = new THREE.MeshPhongMaterial({
    color:n.color, emissive:n.color,
    emissiveIntensity: n.frozen ? 0.1 : 0.4,
    transparent:true, opacity:0.92
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(n.x, n.y, n.z);
  mesh.userData = n;
  scene.add(mesh);
  nodeMap[n.id] = mesh;
  nodeMesh.push(mesh);
});

// ── edge lines (dynamic) ──────────────────────────────────
const edgeObjs = [];
EDGES.forEach(e => {
  const geo = new THREE.BufferGeometry();
  const arr = new Float32Array(6);
  geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
  const mat = new THREE.LineBasicMaterial({
    color: new THREE.Color(e.weight*0.4, e.weight*0.3, 1.0),
    transparent:true, opacity: 0.05 + e.weight*0.6
  });
  const line = new THREE.Line(geo, mat);
  scene.add(line);
  edgeObjs.push({line, src:e.src, tgt:e.tgt, w:e.weight});
});

// ── force simulation ──────────────────────────────────────
const REP  = 9.0;    // repulsion strength
const ATT  = 0.10;   // attraction along edges
const DAMP = 0.82;   // velocity damping

function forceStep() {
  const ids = Object.keys(pos).map(Number);
  // repulsion — all pairs
  for (let i=0;i<ids.length;i++) {
    const a=ids[i]; if (anc[a]) continue;
    for (let j=i+1;j<ids.length;j++) {
      const b=ids[j];
      const dx=pos[a].x-pos[b].x, dy=pos[a].y-pos[b].y, dz=pos[a].z-pos[b].z;
      const d2=dx*dx+dy*dy+dz*dz+0.1;
      const f=REP/d2;
      vel[a].x+=dx*f; vel[a].y+=dy*f; vel[a].z+=dz*f;
      if (!anc[b]){vel[b].x-=dx*f; vel[b].y-=dy*f; vel[b].z-=dz*f;}
    }
  }
  // attraction along edges — stronger connection = stronger pull
  edgeObjs.forEach(e => {
    const a=e.src, b=e.tgt;
    if (!pos[a]||!pos[b]) return;
    const dx=pos[b].x-pos[a].x, dy=pos[b].y-pos[a].y, dz=pos[b].z-pos[a].z;
    const d=Math.sqrt(dx*dx+dy*dy+dz*dz)+0.01;
    const f=ATT*e.w*d;
    if (!anc[a]){vel[a].x+=dx/d*f; vel[a].y+=dy/d*f; vel[a].z+=dz/d*f;}
    if (!anc[b]){vel[b].x-=dx/d*f; vel[b].y-=dy/d*f; vel[b].z-=dz/d*f;}
  });
  // integrate + clamp
  ids.forEach(id => {
    if (anc[id]) return;
    vel[id].x*=DAMP; vel[id].y*=DAMP; vel[id].z*=DAMP;
    pos[id].x+=vel[id].x; pos[id].y+=vel[id].y; pos[id].z+=vel[id].z;
    pos[id].x=Math.max(-14,Math.min(14,pos[id].x));
    pos[id].y=Math.max(-14,Math.min(14,pos[id].y));
    pos[id].z=Math.max(-12,Math.min(12,pos[id].z));
  });
}

// pre-settle
for (let i=0;i<80;i++) forceStep();

let simRunning = false;  // press Space to toggle continuous sim

// ── orbit controls ────────────────────────────────────────
let dragging=false, rightDrag=false, lx=0, ly=0;
const tgt = new THREE.Vector3();
let sph   = new THREE.Spherical().setFromVector3(camera.position.clone().sub(tgt));

document.addEventListener('mousedown', e=>{dragging=true;rightDrag=e.button===2;lx=e.clientX;ly=e.clientY;});
document.addEventListener('mouseup',   ()=>dragging=false);
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('mousemove', e=>{
  if (!dragging) return;
  const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  if (rightDrag){
    const r=new THREE.Vector3(),u=new THREE.Vector3();
    camera.matrix.extractBasis(r,u,new THREE.Vector3());
    tgt.addScaledVector(r,-dx*0.02); tgt.addScaledVector(u,dy*0.02);
  } else {
    sph.theta-=dx*0.005; sph.phi-=dy*0.005;
    sph.phi=Math.max(0.1,Math.min(Math.PI-0.1,sph.phi));
  }
  camera.position.copy(tgt).add(new THREE.Vector3().setFromSpherical(sph));
  camera.lookAt(tgt);
});
document.addEventListener('wheel', e=>{
  sph.radius*=(1+e.deltaY*0.001);
  sph.radius=Math.max(2,Math.min(120,sph.radius));
  camera.position.copy(tgt).add(new THREE.Vector3().setFromSpherical(sph));
  camera.lookAt(tgt);
});
document.addEventListener('keydown', e=>{
  if (e.code==='Space'){simRunning=!simRunning; e.preventDefault();}
});

// ── tooltip ───────────────────────────────────────────────
const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
const tt=document.getElementById('tooltip');
document.addEventListener('mousemove', e=>{
  mouse.x=(e.clientX/window.innerWidth)*2-1;
  mouse.y=-(e.clientY/window.innerHeight)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(nodeMesh);
  if (hits.length>0){
    const d=hits[0].object.userData;
    tt.style.display='block';
    tt.style.left=(e.clientX+14)+'px'; tt.style.top=(e.clientY-10)+'px';
    tt.innerHTML=`<b>${d.label}</b><br>pressure:${d.pressure}<br>Φ:${d.phi}<br>frozen:${d.frozen}`;
  } else tt.style.display='none';
});

window.addEventListener('resize',()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// ── render loop ───────────────────────────────────────────
function animate(){
  requestAnimationFrame(animate);
  if (simRunning) forceStep();
  // sync mesh positions
  NODES.forEach(n=>{ const p=pos[n.id]; if(p) nodeMap[n.id].position.set(p.x,p.y,p.z); });
  // sync edge endpoints
  edgeObjs.forEach(e=>{
    const pa=pos[e.src], pb=pos[e.tgt]; if(!pa||!pb) return;
    const arr=e.line.geometry.attributes.position.array;
    arr[0]=pa.x;arr[1]=pa.y;arr[2]=pa.z;
    arr[3]=pb.x;arr[4]=pb.y;arr[5]=pb.z;
    e.line.geometry.attributes.position.needsUpdate=true;
  });
  renderer.render(scene,camera);
}
animate();
</script>
